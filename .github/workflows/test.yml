name: Tests

on:
  push:
    branches: [main, dev, osnoveRezervacije, fix/github-actions, feature/integrationTests]
  pull_request:
    branches: [main, dev, osnoveRezervacije, fix/github-actions]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npm install

      - name: Run unit tests
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: bolnica_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npm install

      - name: Migrate database
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/bolnica_test"

      - name: Run integration tests
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/bolnica_test"
          REDIS_URL: "redis://localhost:6380"
          TEST_KORISNIK_ID: "2"
          TEST_PATIENT_EMAIL: "pacijent@test.com"
          MASTER_ENCRYPTION_KEY: "b273fca07b41387b72ef988af53bf5513f34edf921efd65fb43bed1c472e8a66"
          JWT_SECRET: "nekiDugačakTajniKljučKojiNikoNeZna123!"
        run: npx vitest run --config vitest.ci.config.ts
