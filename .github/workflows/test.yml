name: Tests

on:
  push:
    branches: [main, dev, osnoveRezervacije, fix/github-actions, feature/integrationTests]
  pull_request:
    branches: [main, dev, osnoveRezervacije, fix/github-actions]

jobs:
  test:
    runs-on: ubuntu-latest

    # DODAJ OVO: Servisi koji će raditi tokom testova
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: bolnica_test
        ports:
          - 5433:5432 # Mapiramo port baš kao u tvom docker-compose.test.yml
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npm install

      # DODAJ OVO: Postavljanje baze prije testova
      - name: Migrate Database
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/bolnica_test"

      - name: Run tests
        working-directory: ./PROJEKAT/bolnicki-sistem/server
        # DODAJ OVO: Environment varijable koje tvoj kod čita
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/bolnica_test"
          REDIS_URL: "redis://localhost:6380"
        run: npm test