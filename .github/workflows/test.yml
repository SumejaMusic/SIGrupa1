name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - osnoveRezervacije
      - fix/github-actions
  pull_request:
    branches:
      - main
      - dev
      - osnoveRezervacije
      - fix/github-actions

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./bolnicki-sistem/server
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./bolnicki-sistem/server
        run: npx prisma generate

      - name: Run tests
        working-directory: ./bolnicki-sistem/server
        run: npm test